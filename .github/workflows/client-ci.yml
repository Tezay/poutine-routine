name: Client CI

on:
  pull_request:
    branches: [main]
    paths:
      - 'client/**'
      - '.github/workflows/client-ci.yml'

defaults:
  run:
    working-directory: client

jobs:
  lint-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: client/package-lock.json

      - run: npm ci
      - run: npm run format:check
      - run: npm run lint
      - run: npm run build
